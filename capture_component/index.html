<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .slot {
    border: 2px dashed #b8c2cc;
    border-radius: 10px;
    background: #f7f9fb;
    height: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.12s ease;
    text-align: center;
    padding: 6px;
    user-select: none;
    outline: none;
  }
  .slot:hover { border-color: #667eea; background: #eef2ff; }
  .slot.active {
    border-color: #667eea;
    border-style: solid;
    background: #eef2ff;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
  }
  .slot.filled {
    border-style: solid;
    border-color: #2e7d32;
    background: #ffffff;
    padding: 4px;
    height: 92px;
    position: relative;
  }
  .slot.filled img {
    max-width: 100%;
    max-height: 72px;
    border-radius: 6px;
    display: block;
  }
  .title { font-weight: 700; font-size: 14px; color: #2d3748; margin-bottom: 4px; }
  .hint  { font-size: 11px; color: #718096; line-height: 1.3; }
  .active .hint { color: #667eea; font-weight: 600; }
  .filled .title-mini {
    position: absolute; top: 3px; left: 6px;
    font-size: 10px; font-weight: 700; color: #2e7d32;
    background: rgba(255,255,255,0.85); padding: 0 4px; border-radius: 4px;
  }
  .clear-btn {
    position: absolute; top: 3px; right: 5px;
    font-size: 12px; line-height: 1; color: #fff; background: #c53030;
    border: none; cursor: pointer; border-radius: 50%;
    width: 18px; height: 18px; padding: 0;
  }
</style>
</head>
<body>
  <div id="slot" class="slot" tabindex="0"></div>

<script>
function sendValue(value) {
  window.parent.postMessage(
    { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: value }, "*");
}
function setFrameHeight(h) {
  window.parent.postMessage(
    { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
}
function ready() {
  window.parent.postMessage(
    { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
}

const slot = document.getElementById("slot");
let LABEL = "Nivel";
let currentData = null;
let isActive = false;

function reportHeight() { setFrameHeight(100); }

function renderEmpty() {
  slot.className = "slot" + (isActive ? " active" : "");
  slot.innerHTML =
    '<div class="title">' + LABEL + '</div>' +
    '<div class="hint">' +
      (isActive ? "Esperando imagen &mdash; &#8984;V" : "Clic y pega con &#8984;V") +
    '</div>';
  reportHeight();
}

function renderFilled(dataUrl) {
  slot.className = "slot filled";
  slot.innerHTML =
    '<div class="title-mini">' + LABEL + '</div>' +
    '<button class="clear-btn" id="clearBtn" title="Quitar">&times;</button>' +
    '<img src="' + dataUrl + '" />';
  document.getElementById("clearBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    currentData = null; isActive = true;
    sendValue(""); renderEmpty(); slot.focus();
  });
  reportHeight();
}

slot.addEventListener("click", function () {
  isActive = true; slot.focus();
  if (!currentData) renderEmpty();
});

window.addEventListener("paste", function (e) {
  if (!isActive) return;
  const items = (e.clipboardData || window.clipboardData).items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf("image") !== -1) {
      const blob = items[i].getAsFile();
      const reader = new FileReader();
      reader.onload = function (ev) {
        currentData = ev.target.result;
        sendValue(currentData);
        renderFilled(currentData);
      };
      reader.readAsDataURL(blob);
      e.preventDefault();
      break;
    }
  }
});

window.addEventListener("message", function (event) {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  // Streamlit puede entregar los argumentos en data.args o en data.args.args
  const args = (data.args && data.args.args) ? data.args.args : (data.args || {});
  if (args.label) LABEL = args.label;
  if (args.value && args.value.length > 0) {
    currentData = args.value; renderFilled(currentData);
  } else if (!currentData) {
    renderEmpty();
  } else {
    renderFilled(currentData);
  }
});

ready();
renderEmpty();
</script>
</body>
</html>
